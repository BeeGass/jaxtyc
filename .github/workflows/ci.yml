name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty type check
        # --exit-zero: 328 pre-existing ty diagnostics from jaxtyping DSL
        # and nullable subprocess pipes. Remove once baseline reaches zero.
        run: uv run ty check --exit-zero

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            uv run pytest --tb=short -q --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80
          else
            uv run pytest --tb=short -q
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install prek
        run: uv tool install prek

      - name: Run prek on all files
        run: prek run --all-files
