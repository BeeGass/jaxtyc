name: Guard main branch

on:
  pull_request:
    branches: [main]

jobs:
  check-ai-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check for AI assistant config files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Files/dirs that must not be merged into main
          BLOCKED_PATTERNS=(
            "^\.claude/"
            "^\.claude-plugin/"
            "^\.codex/"
            "^\.opencode/"
            "^CLAUDE\.md$"
            "^AGENTS\.md$"
          )

          # Get all files changed in this PR
          FILES=$(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")

          FOUND=()
          for pattern in "${BLOCKED_PATTERNS[@]}"; do
            MATCHES=$(echo "$FILES" | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              while IFS= read -r f; do
                FOUND+=("$f")
              done <<< "$MATCHES"
            fi
          done

          if [ ${#FOUND[@]} -gt 0 ]; then
            echo "::error::AI assistant config files must not be merged into main."
            echo ""
            echo "The following files are not allowed on main:"
            for f in "${FOUND[@]}"; do
              echo "  - $f"
            done
            echo ""
            echo "Use 'just pr-to-main' to create a clean PR that excludes these files."
            exit 1
          fi

          echo "No AI config files in PR. OK."
