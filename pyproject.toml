[project]
name = "jaxtyc"
version = "0.6.2"
description = "Static array shape checking for JAX powered by eval_shape"
readme = "README.md"
requires-python = ">=3.11,!=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bryan Gass", email = "bryank123@live.com" }]
keywords = [
    "jax",
    "jaxtyping",
    "shape-checking",
    "type-checking",
    "lsp",
    "static-analysis",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "jax>=0.9.0,<0.10",
    "jaxtyping>=0.2.28,<0.4",
    "pygls>=2.0,<3",
]

[project.optional-dependencies]
watch = ["watchfiles>=1.0,<2"]
flax = ["flax>=0.10.0,<0.12"]
equinox = ["equinox>=0.11,<0.13"]
einops = ["einops>=0.8,<0.9"]
all = ["jaxtyc[watch,flax,equinox,einops]"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "jaxtyc[all]",
]
lint = [
    "ruff>=0.11.0",
    "ty>=0.0.1",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
jaxtyc = "jaxtyc.cli.main:main"

[project.urls]
Homepage = "https://github.com/BeeGass/jaxtyc"
Documentation = "https://beegass.github.io/jaxtyc/"
Repository = "https://github.com/BeeGass/jaxtyc"
Changelog = "https://github.com/BeeGass/jaxtyc/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/BeeGass/jaxtyc/issues"

# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxtyc"]

# =============================================================================
# uv
# =============================================================================

[tool.uv]
package = true
default-groups = ["dev"]
required-version = ">=0.11"
add-bounds = "major"
environments = ["implementation_name == 'cpython'"]

# =============================================================================
# Ruff — Linter / Formatter
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "A", "DTZ", "T10", "RET"]
ignore = [
    "E501",   # line too long — formatter handles this
    "UP040",  # TypeAlias required for Python 3.11 compat (no `type` statement)
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.extend-per-file-ignores]
"test_*.py" = ["E731", "F841", "SIM105"]
"tests/fixtures/*.py" = ["F722", "F821"]

# =============================================================================
# ty — Static Type Checker
# =============================================================================

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.analysis]
# jaxtyping uses a runtime annotation DSL (Float[Array, "batch seq"]) that no
# static type checker can analyze. Must be replaced with Any.
replace-imports-with-any = ["jaxtyping.*"]

# Optional dependencies that may not be installed.
allowed-unresolved-imports = [
    "jaxtyping.*",
    "flax.*",
    "equinox.*",
    "einops.*",
    "watchfiles.*",
]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "ignore"

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:jax.*",
    "ignore::FutureWarning:jax.*",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["jaxtyc"]
branch = true
omit = [
    "src/jaxtyc/cli/*",
    "src/jaxtyc/lsp/mux.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# =============================================================================
# jaxtyc — Self-analysis config
# =============================================================================

[tool.jaxtyc]
severity = "warning"
ignore_rules = []
debounce_ms = 300
