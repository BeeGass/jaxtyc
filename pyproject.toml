[project]
name = "jaxtyc"
version = "0.7.2"
description = "Static array shape checking for JAX powered by eval_shape"
readme = "README.md"
requires-python = ">=3.11,!=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bryan Gass", email = "44324535+BeeGass@users.noreply.github.com" }]
keywords = [
    "jax",
    "jaxtyping",
    "shape-checking",
    "type-checking",
    "lsp",
    "static-analysis",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "jaxtyping>=0.2.28,<0.4",
    "pygls>=2.0,<3",
]

# -----------------------------------------------------------------------------
# Optional Dependencies - JAX Backend Extras
# -----------------------------------------------------------------------------
# JAX backend extras are mutually exclusive (enforced via [tool.uv] conflicts).
# Use: pip install jaxtyc[cpu]  /  uv sync --extra cuda12  / etc.
[project.optional-dependencies]
# CPU-only (Linux/macOS)
cpu = [
    "jax>=0.9.0 ; sys_platform == 'linux' or sys_platform == 'darwin'",
    "jax[cpu]>=0.9.0 ; sys_platform == 'linux' or sys_platform == 'darwin'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux' or sys_platform == 'darwin'",
]
# CPU-only nightly -- keep >=0.9.0 floor for nightly prerelease resolution
cpu-nightly = [
    "jax>=0.9.0 ; sys_platform == 'linux' or sys_platform == 'darwin'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux' or sys_platform == 'darwin'",
]
# Apple Silicon GPU via jax-mps PJRT plugin (third-party, experimental).
# jax-mps translates StableHLO to MLX ops and requires jaxlib 0.9.x bytecode.
# Wheels are currently published for cp313 on macOS ARM64 only.
mac = [
    "jax>=0.4.34 ; sys_platform == 'darwin'",
    "jaxlib>=0.4.34 ; sys_platform == 'darwin'",
    "jax-mps>=0.9.12 ; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
]
# Stable PyPI CUDA 12
cuda12 = [
    "jax>=0.9.0 ; sys_platform == 'linux'",
    "jax[cuda12]>=0.9.0 ; sys_platform == 'linux'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux'",
]
# Stable PyPI CUDA 13
cuda13 = [
    "jax>=0.9.0 ; sys_platform == 'linux'",
    "jax[cuda13]>=0.9.0 ; sys_platform == 'linux'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux'",
]
# Nightly CUDA 12 -- keep >=0.9.0 floor for nightly prerelease resolution
cuda12-nightly = [
    "jax>=0.9.0 ; sys_platform == 'linux'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux'",
    "jax-cuda12-plugin[with-cuda] ; sys_platform == 'linux'",
    "jax-cuda12-pjrt ; sys_platform == 'linux'",
]
# Nightly CUDA 13 -- keep >=0.9.0 floor for nightly prerelease resolution
cuda13-nightly = [
    "jax>=0.9.0 ; sys_platform == 'linux'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux'",
    "jax-cuda13-plugin[with-cuda] ; sys_platform == 'linux'",
    "jax-cuda13-pjrt ; sys_platform == 'linux'",
]
# Google Cloud TPU (stable)
tpu = [
    "jax>=0.9.0 ; sys_platform == 'linux'",
    "jax[tpu]>=0.9.0 ; sys_platform == 'linux'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux'",
]
# Google Cloud TPU (nightly) -- keep >=0.9.0 floor for nightly prerelease resolution
tpu-nightly = [
    "jax>=0.9.0 ; sys_platform == 'linux'",
    "jax[tpu]>=0.9.0 ; sys_platform == 'linux'",
    "jaxlib>=0.9.0 ; sys_platform == 'linux'",
]
# AMD ROCm (from GitHub wheel releases) -- wheels only exist for Python 3.11-3.13.
# jax's rocm7-local extra is broken upstream (jax-rocm7-plugin==0.9.2.* never
# published), so we list the plugin and PJRT packages directly with URL sources.
rocm = [
    "jax>=0.7.1 ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
    "jaxlib>=0.8.0 ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
    "jax-rocm7-pjrt ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
    "jax-rocm7-plugin ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
]
# --- Library integration extras ---
watch = ["watchfiles>=1.0,<2"]
flax = ["flax>=0.10.0,<0.10.3"]
equinox = ["equinox>=0.11,<0.13"]
einops = ["einops>=0.8,<0.9"]
all = ["jaxtyc[watch,flax,equinox,einops]"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "jaxtyc[all]",
]
lint = [
    "ruff>=0.11.0",
    "ty>=0.0.1",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
jaxtyc = "jaxtyc.cli.main:main"

[project.urls]
Homepage = "https://github.com/BeeGass/jaxtyc"
Documentation = "https://beegass.github.io/jaxtyc/"
Repository = "https://github.com/BeeGass/jaxtyc"
Changelog = "https://github.com/BeeGass/jaxtyc/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/BeeGass/jaxtyc/issues"

# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxtyc"]

# =============================================================================
# uv
# =============================================================================

[tool.uv]
package = true
default-groups = ["dev"]
required-version = ">=0.11"
add-bounds = "major"
environments = ["implementation_name == 'cpython'"]

# Only allow prereleases when explicitly requested or when no stable version
# exists. Required so nightly extras can resolve pre-release builds.
prerelease = "if-necessary-or-explicit"

# Minimize resolver forks across platform/extra combinations
fork-strategy = "fewest"

# Mutually exclusive JAX backend extras -- only one backend can be selected
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cpu-nightly" },
        { extra = "mac" },
        { extra = "cuda12" },
        { extra = "cuda13" },
        { extra = "cuda12-nightly" },
        { extra = "cuda13-nightly" },
        { extra = "rocm" },
        { extra = "tpu" },
        { extra = "tpu-nightly" },
    ],
]

# PyPI index (explicit declaration for use in source routing)
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

# JAX nightly index for pre-release builds (CUDA nightly, CPU nightly, etc.)
[[tool.uv.index]]
name = "jax-nightly"
url = "https://us-python.pkg.dev/ml-oss-artifacts-published/jax-public-nightly-artifacts-registry/simple/"
explicit = true

# ROCm JAX releases for jaxlib wheels
[[tool.uv.index]]
name = "rocm-jax"
url = "https://github.com/ROCm/rocm-jax/releases/expanded_assets/rocm-jax-v0.8.0"
explicit = true

# JAX source routing -- stable extras from PyPI, nightly extras from jax-nightly
[tool.uv.sources]
jax = [
    { index = "pypi", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'darwin'" },
    { index = "jax-nightly", extra = "cpu-nightly", marker = "sys_platform == 'linux' or sys_platform == 'darwin'" },
    { index = "pypi", extra = "mac", marker = "sys_platform == 'darwin'" },
    { index = "pypi", extra = "cuda12", marker = "sys_platform == 'linux'" },
    { index = "pypi", extra = "cuda13", marker = "sys_platform == 'linux'" },
    { index = "jax-nightly", extra = "cuda12-nightly", marker = "sys_platform == 'linux'" },
    { index = "jax-nightly", extra = "cuda13-nightly", marker = "sys_platform == 'linux'" },
    { index = "pypi", extra = "rocm", marker = "sys_platform == 'linux'" },
    { index = "pypi", extra = "tpu", marker = "sys_platform == 'linux'" },
    { index = "jax-nightly", extra = "tpu-nightly", marker = "sys_platform == 'linux'" },
]
jaxlib = [
    { index = "pypi", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'darwin'" },
    { index = "jax-nightly", extra = "cpu-nightly", marker = "sys_platform == 'linux' or sys_platform == 'darwin'" },
    { index = "pypi", extra = "mac", marker = "sys_platform == 'darwin'" },
    { index = "pypi", extra = "cuda12", marker = "sys_platform == 'linux'" },
    { index = "pypi", extra = "cuda13", marker = "sys_platform == 'linux'" },
    { index = "jax-nightly", extra = "cuda12-nightly", marker = "sys_platform == 'linux'" },
    { index = "jax-nightly", extra = "cuda13-nightly", marker = "sys_platform == 'linux'" },
    # ROCm uses direct wheel URLs (not on PyPI at 0.9.x)
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jaxlib-0.8.0+rocm7.1.0-cp311-cp311-manylinux_2_27_x86_64.whl", extra = "rocm", marker = "python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jaxlib-0.8.0+rocm7.1.0-cp312-cp312-manylinux_2_27_x86_64.whl", extra = "rocm", marker = "python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jaxlib-0.8.0+rocm7.1.0-cp313-cp313-manylinux_2_27_x86_64.whl", extra = "rocm", marker = "python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jaxlib-0.8.0+rocm7.1.0-cp314-cp314-manylinux_2_27_x86_64.whl", extra = "rocm", marker = "python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pypi", extra = "tpu", marker = "sys_platform == 'linux'" },
    { index = "jax-nightly", extra = "tpu-nightly", marker = "sys_platform == 'linux'" },
]
jax-mps = [
    { index = "pypi", extra = "mac", marker = "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'" },
]
jax-cuda12-plugin = [
    { index = "jax-nightly", extra = "cuda12-nightly" },
]
jax-cuda12-pjrt = [
    { index = "jax-nightly", extra = "cuda12-nightly" },
]
jax-cuda13-plugin = [
    { index = "jax-nightly", extra = "cuda13-nightly" },
]
jax-cuda13-pjrt = [
    { index = "jax-nightly", extra = "cuda13-nightly" },
]
jax-rocm7-pjrt = [
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jax_rocm7_pjrt-0.8.0+rocm7.1.0-py3-none-manylinux_2_28_x86_64.whl", extra = "rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
jax-rocm7-plugin = [
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jax_rocm7_plugin-0.8.0+rocm7.1.0-cp311-cp311-manylinux_2_28_x86_64.whl", extra = "rocm", marker = "python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jax_rocm7_plugin-0.8.0+rocm7.1.0-cp312-cp312-manylinux_2_28_x86_64.whl", extra = "rocm", marker = "python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jax_rocm7_plugin-0.8.0+rocm7.1.0-cp313-cp313-manylinux_2_28_x86_64.whl", extra = "rocm", marker = "python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/ROCm/rocm-jax/releases/download/rocm-jax-v0.8.0/jax_rocm7_plugin-0.8.0+rocm7.1.0-cp314-cp314-manylinux_2_28_x86_64.whl", extra = "rocm", marker = "python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

# =============================================================================
# Ruff — Linter / Formatter
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "A", "DTZ", "T10", "RET"]
ignore = [
    "E501",   # line too long — formatter handles this
    "UP040",  # TypeAlias required for Python 3.11 compat (no `type` statement)
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.extend-per-file-ignores]
"test_*.py" = ["E731", "F841", "SIM105"]
"tests/fixtures/*.py" = ["F722", "F821"]

# =============================================================================
# ty — Static Type Checker
# =============================================================================

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.analysis]
# jaxtyping uses a runtime annotation DSL (Float[Array, "batch seq"]) that no
# static type checker can analyze. Must be replaced with Any.
replace-imports-with-any = ["jaxtyping.*"]

# Optional dependencies that may not be installed.
allowed-unresolved-imports = [
    "jaxtyping.*",
    "flax.*",
    "equinox.*",
    "einops.*",
    "watchfiles.*",
]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "ignore"

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:jax.*",
    "ignore::FutureWarning:jax.*",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["jaxtyc"]
branch = true
omit = [
    "src/jaxtyc/cli/*",
    "src/jaxtyc/lsp/mux.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# =============================================================================
# jaxtyc — Self-analysis config
# =============================================================================

[tool.jaxtyc]
severity = "warning"
ignore_rules = []
debounce_ms = 300
