[project]
name = "jaxtyc"
version = "0.1.0"
description = "Static array shape checking for JAX powered by eval_shape"
readme = "README.md"
requires-python = ">=3.11,!=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Bryan Gass", email = "bryank123@live.com" }]
keywords = [
    "jax",
    "jaxtyping",
    "shape-checking",
    "type-checking",
    "lsp",
    "static-analysis",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "jax>=0.4.20",
    "jaxtyping>=0.2.28",
    "pygls>=2.0",
]

[project.optional-dependencies]
watch = ["watchfiles>=1.0"]
flax = ["flax>=0.10.0"]
equinox = ["equinox>=0.11"]
all = ["jaxtyc[watch,flax,equinox]"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "jaxtyc[all]",
]
lint = [
    "ruff>=0.11.0",
    "ty>=0.0.1",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
jaxtyc = "jaxtyc.cli.main:main"

[project.urls]
Homepage = "https://github.com/BeeGass/jaxtyc"
Documentation = "https://beegass.github.io/jaxtyc/"
Repository = "https://github.com/BeeGass/jaxtyc"
"Bug Tracker" = "https://github.com/BeeGass/jaxtyc/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxtyc"]

[tool.uv]
package = true
default-groups = ["dev"]

# -----------------------------------------------------------------------------
# Ruff - Linter / Formatter
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.extend-per-file-ignores]
"test_*.py" = ["E731", "F841", "SIM105"]
"tests/fixtures/*.py" = ["F722", "F821"]

# -----------------------------------------------------------------------------
# ty - Static Type Checker
# -----------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.analysis]
# jaxtyping uses a runtime annotation DSL (Float[Array, "batch seq"]) that no
# static type checker can analyze. Must be replaced with Any.
replace-imports-with-any = ["jaxtyping.*"]

# Optional dependencies that may not be installed.
allowed-unresolved-imports = [
    "jaxtyping.*",
    "flax.*",
    "equinox.*",
    "watchfiles.*",
]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "ignore"

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
